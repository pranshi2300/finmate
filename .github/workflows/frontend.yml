name: Frontend CI

on:
  push:
  pull_request:

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finmate-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
